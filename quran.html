function toArabicNum(n){
  return n.toString().replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
}

// ════════════════════════════════════════
//  محرك الصوت — مشاري راشد العفاسي
//  آية بآية : everyayah.com/data/Alafasy_128kbps/{SSS}{AAA}.mp3
//  سورة كاملة: quranicaudio.com/quran/mishaari_raashid_al_3afaasee/{SSS}.mp3
// ════════════════════════════════════════
const READER = 'Alafasy_128kbps';
const FULL_BASE = 'https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/';

function ayahUrl(s, a){
  return `https://everyayah.com/data/${READER}/${String(s).padStart(3,'0')}${String(a).padStart(3,'0')}.mp3`;
}
function surahUrl(s){
  return `${FULL_BASE}${String(s).padStart(3,'0')}.mp3`;
}

// ── حالة المشغل ──
let _audio = null;
let _queue = [];   // [{url, label, ayahNum}]
let _qi    = 0;
let _surahMode = false;  // true = سورة كاملة بملف واحد

function audio(){
  if(!_audio){
    _audio = new Audio();
    _audio.addEventListener('ended', _onEnded);
    _audio.addEventListener('timeupdate', _onTime);
    _audio.addEventListener('error', _onErr);
  }
  return _audio;
}

function _onTime(){
  const a = audio();
  if(!a.duration) return;
  document.getElementById('audioProgressFill').style.width = (a.currentTime/a.duration*100)+'%';
}
function _onEnded(){
  if(_surahMode){ _hideBar(); return; }
  if(_qi < _queue.length-1){ _qi++; _playIdx(_qi); }
  else _hideBar();
}
function _onErr(){
  if(!_surahMode && _qi < _queue.length-1){ _qi++; _playIdx(_qi); }
}

function _playIdx(i){
  const item = _queue[i];
  if(!item) return;
  const a = audio();
  a.pause();
  a.src = item.url;
  a.load();
  a.play().catch(()=>{});
  document.getElementById('abSurah').textContent  = item.label;
  document.getElementById('abPlayPause').textContent = '⏸';
  document.getElementById('audioProgressFill').style.width = '0%';
  _showBar();
  // تحديث أزرار الآيات
  document.querySelectorAll('.ayah-play-btn').forEach(b=>b.classList.remove('playing'));
  if(!_surahMode && item.ayahNum){
    const b = document.querySelector(`.ayah-play-btn[data-ayah="${item.ayahNum}"]`);
    if(b) b.classList.add('playing');
  }
}

function _showBar(){
  document.getElementById('audioBar').classList.add('visible');
  document.body.classList.add('audio-open');
}
function _hideBar(){
  const a = audio();
  a.pause(); a.src='';
  document.getElementById('audioBar').classList.remove('visible');
  document.body.classList.remove('audio-open');
  document.querySelectorAll('.ayah-play-btn').forEach(b=>b.classList.remove('playing'));
  document.getElementById('abPlayPause').textContent = '▶';
  document.getElementById('audioProgressFill').style.width = '0%';
  _queue=[]; _qi=0; _surahMode=false;
}

// ── API للخارج ──
// تشغيل آية واحدة مع تتابع بقية الآيات
function playAyah(surahNum, ayahNum){
  _surahMode = false;
  const ayahs = _currentAyahs;
  _queue = [];
  let started = false;
  ayahs.forEach(a=>{
    if(a.numberInSurah === ayahNum) started=true;
    if(started){
      _queue.push({
        url: ayahUrl(surahNum, a.numberInSurah),
        label: `سورة ${SUAR[surahNum-1].n} — الآية ${toArabicNum(a.numberInSurah)}`,
        ayahNum: a.numberInSurah
      });
    }
  });
  _qi=0;
  _playIdx(0);
}

// تشغيل السورة كاملة بملف واحد
function playSurahFull(surahNum){
  _surahMode = true;
  document.getElementById('abLabel').textContent = 'القارئ: مشاري راشد العفاسي — سورة كاملة';
  _queue = [{
    url: surahUrl(surahNum),
    label: `سورة ${SUAR[surahNum-1].n} كاملة`,
    ayahNum: null
  }];
  _qi=0;
  _playIdx(0);
}

// أحداث أزرار الشريط
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('abPlayPause').addEventListener('click',()=>{
    const a = audio();
    if(a.paused){ a.play(); document.getElementById('abPlayPause').textContent='⏸'; }
    else { a.pause(); document.getElementById('abPlayPause').textContent='▶'; }
  });
  document.getElementById('abPrev').addEventListener('click',()=>{
    if(_surahMode) return;
    if(_qi>0){ _qi--; _playIdx(_qi); }
  });
  document.getElementById('abNext').addEventListener('click',()=>{
    if(_surahMode) return;
    if(_qi<_queue.length-1){ _qi++; _playIdx(_qi); }
  });
  document.getElementById('abClose').addEventListener('click', _hideBar);
});

// ════════════════════════════════════════
//  حفظ الموضع
// ════════════════════════════════════════
function getBookmark(){ try{return JSON.parse(localStorage.getItem('q_bm'));}catch{return null;} }
function saveBookmark(s,a){ localStorage.setItem('q_bm',JSON.stringify({surah:s,ayah:a,name:SUAR[s-1].n,ts:Date.now()})); }

let _bmObs=null, _bmTimer=null;
function setupAutoBookmark(surahNum){
  if(_bmObs) _bmObs.disconnect();
  const items = document.querySelectorAll('.ayah-item[data-ayah]');
  _bmObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        clearTimeout(_bmTimer);
        _bmTimer = setTimeout(()=>{
          const n = parseInt(e.target.dataset.ayah);
          saveBookmark(surahNum,n);
          document.querySelectorAll('.ayah-item.auto-bookmarked').forEach(el=>{
            el.classList.remove('auto-bookmarked');
            el.querySelector('.auto-bm-label')?.remove();
          });
          e.target.classList.add('auto-bookmarked');
          if(!e.target.querySelector('.auto-bm-label')){
            const lbl=document.createElement('span');
            lbl.className='auto-bm-label'; lbl.textContent='🔖 موضعك';
            e.target.appendChild(lbl);
          }
        },800);
      }
    });
  },{threshold:0.6,rootMargin:'-20% 0px -20% 0px'});
  items.forEach(el=>_bmObs.observe(el));
}

// ════════════════════════════════════════
//  المنطقة الرئيسية
// ════════════════════════════════════════
const main = document.getElementById('quranMain');
let searchQ = '';
let _currentAyahs = [];

function showSurahList(){
  _hideBar();
  const bm = getBookmark();
  let html = `<div class="quran-controls">
    <input id="qSearch" class="q-search" type="text" placeholder="🔍 ابحث عن سورة..." value="${searchQ}">
  </div>`;
  if(bm){
    html+=`<div class="bookmark-banner" onclick="showSurah(${bm.surah},${bm.ayah})">
      <span style="font-size:1.5rem">🔖</span>
      <div><strong>استكمل من حيث توقفت</strong><br>
      <span>سورة ${bm.name} — الآية ${toArabicNum(bm.ayah)}</span></div>
      <span style="margin-right:auto;color:var(--gold);font-size:1.1rem">←</span>
    </div>`;
  }
  html+=`<div class="suar-grid" id="suarGrid">`;
  SUAR.forEach((s,i)=>{
    const num=i+1, hasBm=bm&&bm.surah===num;
    html+=`<div class="surah-card" onclick="showSurah(${num})">
      <div class="surah-num">${toArabicNum(num)}</div>
      <div class="surah-info">
        <span class="surah-name">${s.n}</span>
        <span class="surah-meta">${toArabicNum(s.a)} آية · ${s.r}</span>
      </div>
      ${hasBm?'<div class="surah-bookmark-dot"></div>':''}
    </div>`;
  });
  html+=`</div>`;
  main.innerHTML=html;
  document.getElementById('qSearch').addEventListener('input',function(){
    searchQ=this.value.trim();
    document.querySelectorAll('.surah-card').forEach(c=>{
      c.style.display=(!searchQ||c.querySelector('.surah-name').textContent.includes(searchQ))?'':'none';
    });
  });
}

async function showSurah(surahNum, scrollToAyah=null){
  main.innerHTML='<div class="spinner"></div>';
  _currentAyahs=[];
  try{
    const res=await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
    if(!res.ok) throw new Error();
    const data=await res.json();
    const ayahs=data.data.ayahs;
    const name =data.data.name;
    _currentAyahs=ayahs;

    const prevBtn=surahNum>1  ?`<button class="nav-btn" onclick="showSurah(${surahNum-1})">السورة السابقة</button>`:'';
    const nextBtn=surahNum<114?`<button class="nav-btn" onclick="showSurah(${surahNum+1})">السورة التالية</button>`:'';

    let html=`
    <div class="surah-nav">
      <button class="nav-btn" onclick="showSurahList()">← رجوع</button>
      <span class="surah-title-display">${name}</span>
      <div style="display:flex;gap:8px">${prevBtn}${nextBtn}</div>
    </div>

    <div class="surah-audio-row">
      <button class="surah-full-btn" onclick="playSurahFull(${surahNum})">
        🎧 استمع للسورة كاملة — مشاري راشد العفاسي
      </button>
    </div>

    <p style="text-align:center;color:var(--text3);font-size:0.82rem;margin-bottom:24px">
      📍 موضع قراءتك يُحفظ تلقائياً · 🔊 اضغط على زر الاستماع بجانب أي آية
    </p>`;

    if(surahNum!==1&&surahNum!==9){
      html+=`<div style="text-align:center;margin-bottom:28px;">
        <div class="hero-ayah" style="display:inline-flex;padding:14px 28px;">
          <span class="ayah-text" style="font-size:1.6rem;">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</span>
        </div>
      </div>`;
    }

    function stripBasmala(t){
      if(!t) return t;
      t=t.replace(/\uFDFD/g,'');
      t=t.replace(/بِسْمِ\s*ٱللَّهِ\s*ٱلرَّحْمَٰنِ\s*ٱلرَّحِيمِ/u,'');
      t=t.replace(/بِسْمِ\s*اللَّهِ\s*الرَّحْمَنِ\s*الرَّحِيمِ/u,'');
      t=t.replace(/بِسْمِ\s*ٱللَّهِ\s*ٱلرَّحْمَنِ\s*ٱلرَّحِيمِ/u,'');
      t=t.replace(/بسم\s*الله\s*الرحمن\s*الرحيم/u,'');
      t=t.replace(/^[\s\u0020\u00a0\u200b،؛:.،\-–—()[\]]+/,'').trim();
      return t||arguments[0];
    }

    html+=`<div class="ayah-viewer">`;
    ayahs.forEach(a=>{
      const display=(a.numberInSurah===1&&surahNum!==1&&surahNum!==9)?stripBasmala(a.text):a.text;
      html+=`<div class="ayah-item" data-ayah="${a.numberInSurah}" id="ayah-${a.numberInSurah}">
        <span class="ayah-text">${display}</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;">
          <span class="ayah-num-badge">${toArabicNum(a.numberInSurah)}</span>
          <button class="ayah-play-btn" data-ayah="${a.numberInSurah}"
            onclick="playAyah(${surahNum},${a.numberInSurah})">
            🔊 استمع
          </button>
        </div>
      </div>`;
    });
    html+=`</div>`;

    main.innerHTML=html;
    setupAutoBookmark(surahNum);

    if(scrollToAyah){
      setTimeout(()=>{
        const el=document.getElementById('ayah-'+scrollToAyah);
        if(el){
          el.scrollIntoView({behavior:'smooth',block:'center'});
          el.classList.add('auto-bookmarked');
          const lbl=document.createElement('span');
          lbl.className='auto-bm-label'; lbl.textContent='🔖 موضعك';
          el.appendChild(lbl);
        }
      },400);
    }

    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){ const v=_firstVisible(); if(v) saveBookmark(surahNum,parseInt(v.dataset.ayah)); }
    });
    window.addEventListener('beforeunload',()=>{
      const v=_firstVisible(); if(v) saveBookmark(surahNum,parseInt(v.dataset.ayah));
    });

  }catch(e){
    main.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--text2);">
      <p style="font-size:1.1rem;margin-bottom:16px;">⚠️ تعذّر تحميل السورة</p>
      <p style="color:var(--text3);">يرجى التحقق من اتصالك بالإنترنت</p>
      <button class="nav-btn" style="margin-top:20px" onclick="showSurah(${surahNum})">إعادة المحاولة</button>
    </div>`;
  }
}

function _firstVisible(){
  for(const el of document.querySelectorAll('.ayah-item[data-ayah]')){
    const r=el.getBoundingClientRect();
    if(r.top>=0&&r.top<window.innerHeight*0.7) return el;
  }
  return null;
}

document.addEventListener('DOMContentLoaded', showSurahList);

// ════════════════════════════════════════
//  تنزيل النص بدون نت
// ════════════════════════════════════════
const downloadQBtn = document.getElementById('downloadQBtn');
const downloadStatus = document.getElementById('downloadStatus');
function setStatus(t){ if(downloadStatus) downloadStatus.textContent=t; }

if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e=>{
    const d=e.data||{};
    if(d.type==='DOWNLOAD_PROGRESS') setStatus(`⬇️ تنزيل السور: ${d.done}/${d.total}`);
    else if(d.type==='DOWNLOAD_COMPLETE'){
      setStatus('✅ اكتمل تنزيل السور. يمكنك القراءة بدون اتصال.');
      localStorage.setItem('q_downloaded','1');
    }
    else if(d.type==='AUDIO_DOWNLOAD_PROGRESS') setStatus(`🎧 تنزيل التلاوة: ${d.done}/${d.total} سورة`);
    else if(d.type==='AUDIO_DOWNLOAD_COMPLETE'){
      setStatus('✅ اكتملت التلاوة. يمكنك الاستماع بدون اتصال.');
      localStorage.setItem('q_audio_downloaded','1');
    }
  });
}

if(downloadQBtn) downloadQBtn.addEventListener('click',async()=>{
  if(localStorage.getItem('q_downloaded')) return setStatus('✅ السور محمّلة فعلاً');
  if(!confirm('تنزيل جميع السور للقراءة بدون اتصال؟')) return;
  const reg=await navigator.serviceWorker.ready;
  reg.active?.postMessage({type:'DOWNLOAD_QURAN'});
  setStatus('⬇️ بدء تنزيل السور...');
});

// ════════════════════════════════════════
//  تنزيل التلاوة الصوتية
// ════════════════════════════════════════
document.getElementById('downloadAudioBtn').addEventListener('click', async()=>{
  if(localStorage.getItem('q_audio_downloaded')) return setStatus('✅ التلاوة محمّلة فعلاً');
  if(!confirm('سيتم تنزيل تلاوة مشاري راشد العفاسي للسور كاملة.\nقد يستغرق وقتاً ويستهلك بيانات.\nمتابعة؟')) return;
  if(!('serviceWorker' in navigator)) return setStatus('خدمة العمل غير متوفرة');
  const reg=await navigator.serviceWorker.ready;
  reg.active?.postMessage({type:'DOWNLOAD_AUDIO'});
  setStatus('🎧 بدء تنزيل التلاوة...');
});
</script>
