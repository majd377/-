// =============================================
//  BOOKMARK  (auto-saved)
// =============================================
function getBookmark(){
  try { return JSON.parse(localStorage.getItem('q_bm')); } catch{ return null; }
}
function saveBookmark(surah, ayah){
  localStorage.setItem('q_bm', JSON.stringify({surah, ayah, name: SUAR[surah-1].n, ts: Date.now()}));
}

// =============================================
//  INTERSECTION OBSERVER  — auto bookmark
// =============================================
let bmObserver = null;
let bmDebounce = null;

function setupAutoBookmark(surahNum) {
  if (bmObserver) bmObserver.disconnect();
  const items = document.querySelectorAll('.ayah-item[data-ayah]');
  bmObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const ayahNum = parseInt(entry.target.dataset.ayah);
        clearTimeout(bmDebounce);
        bmDebounce = setTimeout(() => {
          saveBookmark(surahNum, ayahNum);
          // subtle visual indicator
          document.querySelectorAll('.ayah-item.auto-bookmarked').forEach(el => {
            el.classList.remove('auto-bookmarked');
            const lbl = el.querySelector('.auto-bm-label');
            if (lbl) lbl.remove();
          });
          entry.target.classList.add('auto-bookmarked');
          if (!entry.target.querySelector('.auto-bm-label')) {
            const lbl = document.createElement('span');
            lbl.className = 'auto-bm-label';
            lbl.textContent = '🔖 موضعك';
            entry.target.appendChild(lbl);
          }
        }, 800);
      }
    });
  }, { threshold: 0.6, rootMargin: '-20% 0px -20% 0px' });

  items.forEach(el => bmObserver.observe(el));
}

// ── Show Juz (show surah list filtered) ──
async function showJuz(juzNum) {
  const [startSurah] = JUZ_START[juzNum-1];
  const endSurah = juzNum < 30 ? JUZ_START[juzNum][0] : 114;

  main.innerHTML = `<div class="spinner"></div>`;
  // Load all surahs in this juz and display together
  const surahs = [];
  for (let s = startSurah; s <= endSurah; s++) {
    if (SUAR[s-1].j === juzNum || s === startSurah) surahs.push(s);
  }

  let html = `<div class="surah-nav" style="margin-bottom:24px;">
    <button class="nav-btn" onclick="showJuzList()">← الأجزاء</button>
    <span class="surah-title-display">الجزء ${toArabicNum(juzNum)}</span>
    <div style="display:flex;gap:8px">
      ${juzNum>1?`<button class="nav-btn" onclick="showJuz(${juzNum-1})">الجزء السابق</button>`:''}
      ${juzNum<30?`<button class="nav-btn" onclick="showJuz(${juzNum+1})">الجزء التالي</button>`:''}
    </div>
  </div>
  <p style="text-align:center;color:var(--text3);margin-bottom:28px;font-size:0.9rem">
    اختر سورة من هذا الجزء للقراءة
  </p>
  <div class="suar-grid" style="max-width:900px;margin:0 auto;">`;

  SUAR.forEach((s,i) => {
    if (s.j === juzNum) {
      html += `<div class="surah-card" onclick="showSurah(${i+1})">
        <div class="surah-num">${toArabicNum(i+1)}</div>
        <div class="surah-info">
          <span class="surah-name">${s.n}</span>
          <span class="surah-meta">${toArabicNum(s.a)} آية &nbsp;·&nbsp; ${s.r}</span>
        </div>
      </div>`;
    }
  });
  html += `</div>`;
  main.innerHTML = html;
}

// ── Show Surah ──
async function showSurah(surahNum, scrollToAyah = null) {
  main.innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    const ayahs = data.data.ayahs;
    const name  = data.data.name;

    const prevBtn = surahNum > 1   ? `<button class="nav-btn" onclick="showSurah(${surahNum-1})">السورة السابقة</button>` : '';
    const nextBtn = surahNum < 114 ? `<button class="nav-btn" onclick="showSurah(${surahNum+1})">السورة التالية</button>` : '';
    const backTarget = currentView === 'juz' ? `showJuz(${SUAR[surahNum-1].j})` : 'showSurahList()';

    let html = `
    <div class="surah-nav">
      <button class="nav-btn" onclick="${backTarget}">← رجوع</button>
      <span class="surah-title-display">${name}</span>
      <div style="display:flex;gap:8px">${prevBtn}${nextBtn}</div>
    </div>
    <p style="text-align:center;color:var(--text3);font-size:0.82rem;margin-bottom:24px">
      📍 موضع قراءتك يُحفظ تلقائياً عند التمرير
    </p>`;

    if (surahNum !== 1 && surahNum !== 9) {
      html += `<div style="text-align:center;margin-bottom:28px;">
        <div class="hero-ayah" style="display:inline-flex;padding:14px 28px;">
          <span class="ayah-text" style="font-size:1.6rem;">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</span>
        </div>
      </div>`;
    }
    // Display-only Basmala stripping: strip basmala from first ayah display only
    function stripBasmalaForDisplay(text) {
      if (!text) return text;
      let t = text;
      // 1) Unicode basmala ligature ﷽ (U+FDFD)
      t = t.replace(/\uFDFD/g, '');
      // 2) Fully vocalized forms from the API
      t = t.replace(/بِسْمِ\s*ٱللَّهِ\s*ٱلرَّحْمَٰنِ\s*ٱلرَّحِيمِ/u, '');
      t = t.replace(/بِسْمِ\s*اللَّهِ\s*الرَّحْمَنِ\s*الرَّحِيمِ/u, '');
      t = t.replace(/بِسْمِ\s*ٱللَّهِ\s*ٱلرَّحْمَنِ\s*ٱلرَّحِيمِ/u, '');
      // 3) Plain unvocalized forms
      t = t.replace(/بسم\s*الله\s*الرحمن\s*الرحيم/u, '');
      // 4) Clean up any leading punctuation/space left behind
      t = t.replace(/^[\s\u0020\u00a0\u200b،؛:.،\-–—()[\]]+/, '').trim();
      return t || text; // fallback to original if stripping ate everything
    }

    html += `<div class="ayah-viewer">`;
    ayahs.forEach(a => {
      const displayText = (a.numberInSurah === 1 && surahNum !== 1 && surahNum !== 9) ? stripBasmalaForDisplay(a.text) : a.text;
      html += `<div class="ayah-item" data-ayah="${a.numberInSurah}" id="ayah-${a.numberInSurah}">
        <span class="ayah-text">${displayText}</span>
        <span class="ayah-num-badge">${toArabicNum(a.numberInSurah)}</span>
      </div>`;
    });
    html += `</div>`;

    main.innerHTML = html;

    // Setup auto bookmark observer
    setupAutoBookmark(surahNum);

    // Scroll to saved position
    if (scrollToAyah) {
      setTimeout(() => {
        const el = document.getElementById('ayah-' + scrollToAyah);
        if (el) {
          el.scrollIntoView({ behavior:'smooth', block:'center' });
          el.classList.add('auto-bookmarked');
          const lbl = document.createElement('span');
          lbl.className = 'auto-bm-label';
          lbl.textContent = '🔖 موضعك';
          el.appendChild(lbl);
        }
      }, 400);
    }

    // Also save on page-hide / visibility change
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        const visible = getFirstVisible();
        if (visible) saveBookmark(surahNum, parseInt(visible.dataset.ayah));
      }
    });
    window.addEventListener('beforeunload', () => {
      const visible = getFirstVisible();
      if (visible) saveBookmark(surahNum, parseInt(visible.dataset.ayah));
    });

  } catch(e) {
    main.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text2);">
      <p style="font-size:1.1rem;margin-bottom:16px;">⚠️ تعذّر تحميل السورة</p>
      <p style="color:var(--text3);">يرجى التحقق من اتصالك بالإنترنت</p>
      <button class="nav-btn" style="margin-top:20px" onclick="showSurah(${surahNum})">إعادة المحاولة</button>
    </div>`;
  }
}

function getFirstVisible(){
  const items = document.querySelectorAll('.ayah-item[data-ayah]');
  for (const el of items) {
    const r = el.getBoundingClientRect();
    if (r.top >= 0 && r.top < window.innerHeight * 0.7) return el;
  }
  return null;
}

document.addEventListener('DOMContentLoaded', showSurahList);
</script>
</body>
</html>
