const counts={};
function showTab(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAzkar(tab);
}
function renderAzkar(tab){
  const list=AZKAR[tab];let html='';
  list.forEach((z,i)=>{
    const key=tab+'_'+i;
    const cur=counts[key]??0;
    const done=cur>=z.count;
    html+=`<div class="zikr-card" style="${done?'opacity:0.55;':''}">
      <span class="zikr-text">${z.text}</span>
      <div class="zikr-meta">
        <span class="zikr-source">📚 ${z.source}</span>
        <button class="zikr-count-btn" onclick="countZikr('${tab}',${i},${z.count})" ${done?'disabled':''}>
          ${done?'اكتمل':`<span class="count-display">${cur}/${z.count}</span>    `}
        </button>
      </div>
    </div>`;
  });
  document.getElementById('azkarContent').innerHTML=html;
}
function countZikr(tab,idx,max){
  const key=tab+'_'+idx;
  counts[key]=Math.min((counts[key]??0)+1,max);
  renderAzkar(tab);
}
document.addEventListener('DOMContentLoaded',()=>renderAzkar('morning'));
